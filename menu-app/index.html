<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <title>menu-app</title>

  <body>
    <div id="root">
      <div style="font-family: PingFang SC, system-ui, sans-serif; max-width: 820px; margin: 48px auto; padding: 20px; border: 1px solid #ecf2fb; border-radius: 12px; color: #1d2e4a; line-height: 1.6;">
        <h1 style="margin: 0 0 12px; font-size: 22px; color: #081e40;">menu-app 预览提示</h1>
        <p style="margin: 0 0 8px;">你当前可能是直接打开了源码文件 <b>menu-app/index.html</b>，Vite 源码模式需要通过开发服务访问。</p>
        <p style="margin: 0 0 8px;">请在项目目录执行：<code style="background:#f2f7ff;padding:2px 6px;border-radius:6px;">npm run dev -- --host 127.0.0.1 --port 4173</code></p>
        <p style="margin: 0 0 8px;">然后访问：<a href="http://127.0.0.1:4173/">http://127.0.0.1:4173/</a></p>
        <p style="margin: 0;">若需离线打开 HTML，请先执行 <code style="background:#f2f7ff;padding:2px 6px;border-radius:6px;">npm run build</code>，再打开 <b>menu-app/dist/index.html</b>。</p>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
